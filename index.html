<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="game-uuid" content="51ab8830-d8f3-4776-bbb7-e394396076a4" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bokeh Web</title>
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      html,body{margin:0;min-height:100%;background:#080606}
      .boot-bridge{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#3a1612 0,#100c0c 48%,#080606 100%);color:#fff;pointer-events:auto;transition:opacity .32s ease,visibility .32s}
      .boot-bridge.is-ready{opacity:0;visibility:hidden;pointer-events:none}
      .boot-bridge__core{text-align:center;font:700 10px/1.3 ui-monospace,monospace;letter-spacing:.22em}
      .boot-bridge__mark{width:62px;height:62px;margin:0 auto 18px;border:1px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:inset 0 0 0 16px rgba(255,102,78,.1);animation:bw-boot 1.1s ease-in-out infinite alternate}
      @keyframes bw-boot{to{transform:scale(.72);filter:blur(3px);opacity:.48}}
      @media(prefers-reduced-motion:reduce){.boot-bridge__mark{animation:none}}
    </style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <div class="boot-bridge" role="status" aria-live="polite"><div class="boot-bridge__core"><div class="boot-bridge__mark" aria-hidden="true"></div>BOKEH WEB</div></div>
    <header class="hud">
      <p>BOKEH WEB</p>
      <div class="focus-marks" aria-label="Focus planes"><i></i><i></i><i></i></div>
    </header>
    <section class="sleeping">
      <button class="wake" type="button" disabled aria-busy="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74c1.21-.81 2-2.18 2-3.74a4 4 0 1 0-8 0c0 1.56.79 2.93 2 3.74zM18.84 15.87l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6a1.5 1.5 0 0 0-3 0v10.74l-3.43-.72a1 1 0 0 0-1.05.49 1 1 0 0 0 .12 1.16l3.84 4.15c.37.4.89.63 1.43.63h6.55c.85 0 1.56-.6 1.74-1.42l.95-4.47a1.5 1.5 0 0 0-.8-1.92z" /></svg>
        <span>光学组件载入中…</span>
      </button>
    </section>
    <footer class="guide">
      <p>正在准备光学场…</p>
      <button class="restart" type="button" hidden>重新校准</button>
    </footer>
    <script>
      (() => {
        const boot = document.querySelector('.boot-bridge')
        const label = document.querySelector('.wake span')
        if (label && !navigator.language.toLowerCase().startsWith('zh')) {
          label.textContent = 'Loading optical components…'
        }
        const guide = document.querySelector('.guide p')
        if (guide && !navigator.language.toLowerCase().startsWith('zh')) {
          guide.textContent = 'Preparing the optical field…'
        }
        if (!boot) return
        boot.classList.add('is-ready')
        window.setTimeout(() => boot.remove(), 420)
      })()
    </script>
    <script src="./libs/dependencies/three.js"></script>
    <script src="./libs/dependencies/OrbitControls.js"></script>
    <script src="./libs/dependencies/jquery.js"></script>
    <script src="./libs/globals.js"></script>
    <script src="./libs/geometries/line.js"></script>
    <script src="./libs/geometries/quad.js"></script>
    <script src="./libs/shaders/shaderpass.js"></script>
    <script src="./libs/shaders/postproc.js"></script>
    <script src="./libs/shaders/line.js"></script>
    <script src="./libs/shaders/quad.js"></script>
    <script src="./libs/utils.js"></script>
    <script src="./libs/perlinNoise.js"></script>
    <script src="./libs/curlNoise.js"></script>
    <script src="./libs/createScene.js"></script>
    <script src="./libs/main.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
